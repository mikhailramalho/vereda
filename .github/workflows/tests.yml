name: Tests

# Changes only to docs/ or Markdown files run no tests. regression is a
# required check for landing a pull request, so on pull requests the
# workflow always starts and the job is skipped instead: a skipped job counts
# as passed, a workflow that never ran leaves the check pending.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # Only a file list read in full can say false: the files API lists up
        # to 3000 (a diff, at most 300), and any failure leaves code true, so
        # regression runs and this job still passes.
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
                      --jq '.[].filename') || files=
            # 3000 files may be a list cut short, so it proves nothing.
            if [ -n "$files" ] && [ "$(wc -l <<< "$files")" -lt 3000 ] &&
               ! grep -qvE '^docs/|\.md$' <<< "$files"; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  regression:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # LLVM 21 from apt.llvm.org (the image has 16 to 18). Configure finds it
      # in /usr/lib/llvm-21 and downloads only camada; its libraries are
      # plain objects, so links need no ThinLTO step.
      # The step has hung for hours (twice on 2026-11-24); fail it instead.
      - name: Install packages
        timeout-minutes: 20
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libxml2-dev libzstd-dev libgmp-dev libmpfr-dev gcc-multilib clang-21 lld-21 llvm-21-dev libpolly-21-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DDOWNLOAD_DEPENDENCIES=ON

      - name: Build
        run: ninja -C build

      - name: Test
        # Three at a time: each test may use REGRESS_MEMORY_LIMIT (4 GB), and
        # the runner has 16 GB. Each test's time and memory go to
        # REGRESS_STATS, which perf.yml compares with the base's.
        env:
          REGRESS_STATS: ${{ github.workspace }}/regress-stats
        run: ctest --test-dir build -j3 --output-on-failure

      - name: Upload the tests' time and memory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regress-stats
          path: regress-stats/
          retention-days: 30
          if-no-files-found: ignore
