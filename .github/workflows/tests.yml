name: Tests

# Changes only to docs/ or Markdown files run no tests. regression is a
# required check for landing a pull request, so on pull requests the
# workflow always starts and the job is skipped instead: a skipped job counts
# as passed, a workflow that never ran leaves the check pending.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        # Only a file list read in full can say false; any failure here
        # leaves code unset, and regression runs.
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            files=$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)
            if [ -n "$files" ] && ! grep -qvE '^docs/|\.md$' <<< "$files"; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  regression:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The pinned LLVM release unpacks to about 11 GB, more than the runner
      # has free, so drop preinstalled toolchains Vereda does not use.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libxml2-dev libzstd-dev libgmp-dev libmpfr-dev gcc-multilib

      - name: Configure
        run: cmake -S . -B build -G Ninja -DDOWNLOAD_DEPENDENCIES=ON

      - name: Build
        run: ninja -C build

      - name: Test
        # Three at a time: each test may use REGRESS_MEMORY_LIMIT (4 GB), and
        # the runner has 16 GB.
        run: ctest --test-dir build -j3 --output-on-failure
