name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The pinned LLVM release unpacks to about 11 GB, more than the runner
      # has free, so drop preinstalled toolchains Vereda does not use.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libxml2-dev libzstd-dev libgmp-dev libmpfr-dev gcc-multilib

      - name: Configure
        run: cmake -S . -B build -G Ninja -DDOWNLOAD_DEPENDENCIES=ON

      - name: Build
        run: ninja -C build

      - name: Test
        # Three at a time: each test may use REGRESS_MEMORY_LIMIT (4 GB), and
        # the runner has 16 GB. Each test's time and memory go to
        # REGRESS_STATS, which perf.yml compares with the base's.
        env:
          REGRESS_STATS: ${{ github.workspace }}/regress-stats
        run: ctest --test-dir build -j3 --output-on-failure

      - name: Upload the tests' time and memory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regress-stats
          path: regress-stats/
          retention-days: 30
          if-no-files-found: ignore
