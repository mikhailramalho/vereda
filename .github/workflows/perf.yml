# Catches performance regressions: builds the pull request's base and head,
# runs the benchmark list (tests/bench.txt) with both binaries side by
# side on this runner, and fails when head is much slower, uses much more
# memory, times out or changes a verdict (tests/bench.py), and posts the
# tests that got better or worse on the pull request. Verdicts are tests.yml's job; this one only
# compares base with head.
name: Performance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: Commit or branch to compare the dispatched one against
        default: main

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: head

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base }}
          path: base

      # The pinned LLVM release unpacks to about 11 GB, more than the runner
      # has free, so drop preinstalled toolchains Vereda does not use.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev libxml2-dev libzstd-dev libgmp-dev libmpfr-dev gcc-multilib

      # The unpacked dependencies, without the archives they came from. A
      # cache saved by a pull request serves only that pull request's later
      # runs; one saved by a run dispatched on main serves them all.
      - name: Restore dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            head/build/deps
            !head/build/deps/*.tar.*
          key: deps-${{ hashFiles('head/cmake/Dependencies.cmake') }}

      # LLVM and camada as head's configure found them, for base's build
      # and for the benchmark.
      - name: Build head
        run: |
          cmake -S head -B head/build -G Ninja -DDOWNLOAD_DEPENDENCIES=ON
          ninja -C head/build
          llvm_dir=$(sed -n 's/^LLVM_DIR:PATH=//p' head/build/CMakeCache.txt)
          echo "LLVM=${llvm_dir%/lib/cmake/llvm}" >> "$GITHUB_ENV"
          sed -n 's/^camada_DIR:PATH=/CAMADA_DIR=/p' head/build/CMakeCache.txt >> "$GITHUB_ENV"

      # Here, not at the end: a regression fails the job, and the download
      # is worth keeping all the same.
      - name: Save dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            head/build/deps
            !head/build/deps/*.tar.*
          key: ${{ steps.deps.outputs.cache-primary-key }}

      # The downloaded LLVM is an LTO build, so base needs its clang and lld
      # too, as DOWNLOAD_DEPENDENCIES would set them.
      - name: Build base
        run: |
          cmake -S base -B base/build -G Ninja \
            -DLLVM_DIR=$LLVM/lib/cmake/llvm -Dcamada_DIR=$CAMADA_DIR \
            -DCMAKE_C_COMPILER=$LLVM/bin/clang -DCMAKE_CXX_COMPILER=$LLVM/bin/clang++ \
            -DCMAKE_LINKER_TYPE=LLD -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=$LLVM/bin/ld.lld
          ninja -C base/build

      # The full table goes to the step summary; changes.md holds only the
      # tests that regressed or improved, and does not exist when none did.
      - name: Benchmark
        id: bench
        run: >
          head/tests/bench.py --clang $LLVM/bin/clang --base-root base
          --changes changes.md base/build/vereda head/build/vereda

      # One comment per pull request, edited on each later run and posted
      # even when the benchmark found a regression. When nothing changed,
      # the comment of an earlier run is deleted rather than left stale.
      - name: Comment on the pull request
        if: >
          always() && github.event_name == 'pull_request' &&
          (steps.bench.outcome == 'success' || steps.bench.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -s changes.md ]; then
            { echo "## Performance: base → head"
              echo
              echo "Base $BASE, head $HEAD. Only the tests that got better or worse;"
              echo "the full table is in the job's summary."
              echo
              cat changes.md; } > comment.md
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md \
              --edit-last --create-if-none
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq \
              '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## Performance"))) | .id' |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"
            done
          fi
