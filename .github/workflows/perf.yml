# Catches performance changes across the whole regression suite. It takes
# the head's numbers from the pull request's own Tests run (tests.yml
# records each test's time and memory), then the base's from the Tests run
# on main, and screens them for tests whose numbers differ. Those are measured
# again side by side on this runner with both binaries (tests/bench.py),
# since two suite runs on different machines are too noisy to compare
# alone. Only then does it build: with no candidate, it builds nothing. When
# main has no numbers, it builds the base and runs its suite here. It fails
# when head is much slower, uses much more memory or times out, and posts
# the tests that got better or worse. Verdicts are tests.yml's job.
name: Performance

on:
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:
    inputs:
      base:
        description: Commit or branch to compare the dispatched one against
        default: main

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  bench:
    runs-on: ubuntu-24.04
    # Waiting for the Tests runs, and when needed two builds, the base's
    # suite (about 30 minutes three at a time) and the side-by-side reruns.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          path: head

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || inputs.base }}
          path: base
          # History to walk back past docs-only commits to numbers on main.
          fetch-depth: 50

      # The pull request's own Tests run first: it is the one this job
      # depends on most, and main's run for the base is usually done by the
      # time it is.
      - name: Wait for the pull request's tests
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 60); do
            id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow tests.yml --commit "$HEAD" \
                   --event pull_request --json databaseId -q '.[0].databaseId')
            [ -n "$id" ] && break
            sleep 30
          done
          [ -n "$id" ] || { echo "no Tests run for $HEAD"; exit 1; }
          gh run watch "$id" -R "$GITHUB_REPOSITORY" --interval 60 > /dev/null || true
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n regress-stats -D head-stats
          ls head-stats | wc -l

      # After the pull request's own tests, so main's run for the base has
      # most likely finished too; from the Tests run of the base commit's
      # push to main, waiting for it if it is still running. A commit without a run is skipped only if it
      # touched docs alone (tests.yml skips those, and the binary is the
      # same); a code commit without numbers, or a run that failed before
      # uploading them or whose numbers expired, leaves found unset.
      - name: Get the base's numbers from main
        id: base-stats
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for c in $(git -C base rev-list --first-parent -n 50 HEAD); do
            id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow tests.yml --commit "$c" \
                   --event push --json databaseId -q '.[0].databaseId')
            if [ -z "$id" ]; then
              if git -C base diff-tree --no-commit-id --name-only -r "$c" |
                   grep -qvE '^docs/|\.md$'; then
                echo "code commit $c has no Tests run"
                break
              fi
              continue
            fi
            gh run watch "$id" -R "$GITHUB_REPOSITORY" --interval 60 > /dev/null || true
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n regress-stats -D base-stats; then
              echo "base numbers from $c, run $id: $(ls base-stats | wc -l) tests"
              echo "found=true" >> "$GITHUB_OUTPUT"
            else
              rm -rf base-stats
              echo "run $id of $c has no numbers"
            fi
            break
          done

      # Python only: no build unless the screen finds a test whose numbers
      # differ, or main had no numbers for the base.
      - name: Screen the numbers
        id: screen
        if: github.event_name == 'pull_request'
        env:
          FOUND: ${{ steps.base-stats.outputs.found }}
        run: |
          if [ "$FOUND" = true ]; then
            python3 -c "import sys; sys.path.insert(0, 'head/tests'); import bench
          names = bench.candidates('base-stats', 'head-stats')
          names and print('\n'.join(names))" > candidates.txt
            echo "$(grep -c . candidates.txt) tests changed between the suite runs"
            cat candidates.txt
          fi
          if [ "$FOUND" != true ] || [ -s candidates.txt ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      # LLVM 21 from apt.llvm.org (the image has 16 to 18). Configure finds it
      # in /usr/lib/llvm-21 and downloads only camada; its libraries are
      # plain objects, so links need no ThinLTO step.
      - name: Install packages
        if: github.event_name != 'pull_request' || steps.screen.outputs.build == 'true'
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt-get update
          sudo apt-get install -y ninja-build zlib1g-dev libxml2-dev libzstd-dev libgmp-dev libmpfr-dev gcc-multilib clang-21 lld-21 llvm-21-dev libpolly-21-dev

      # LLVM and camada as head's configure found them, for base's build
      # and for the benchmark.
      - name: Build head
        if: github.event_name != 'pull_request' || steps.screen.outputs.build == 'true'
        run: |
          cmake -S head -B head/build -G Ninja -DDOWNLOAD_DEPENDENCIES=ON
          ninja -C head/build
          llvm_dir=$(sed -n 's/^LLVM_DIR:PATH=//p' head/build/CMakeCache.txt)
          echo "LLVM=${llvm_dir%/lib/cmake/llvm}" >> "$GITHUB_ENV"
          sed -n 's/^camada_DIR:PATH=/CAMADA_DIR=/p' head/build/CMakeCache.txt >> "$GITHUB_ENV"

      # The same LLVM, camada, clang and lld as head, given explicitly, so a
      # base from before configure found an installed LLVM builds the same.
      - name: Build base
        if: github.event_name != 'pull_request' || steps.screen.outputs.build == 'true'
        run: |
          cmake -S base -B base/build -G Ninja \
            -DLLVM_DIR=$LLVM/lib/cmake/llvm -Dcamada_DIR=$CAMADA_DIR \
            -DCMAKE_C_COMPILER=$LLVM/bin/clang -DCMAKE_CXX_COMPILER=$LLVM/bin/clang++ \
            -DCMAKE_LINKER_TYPE=LLD -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=$LLVM/bin/ld.lld
          ninja -C base/build

      # Main had no numbers: run the base's suite here, with head's run.py,
      # which records them. Failing tests do not matter here, tests.yml
      # judges them.
      - name: Run the base's tests
        if: github.event_name == 'pull_request' && steps.base-stats.outputs.found != 'true'
        env:
          REGRESS_STATS: ${{ github.workspace }}/base-stats
        run: |
          cp head/tests/run.py base/tests/run.py
          ctest --test-dir base/build -j3 > /dev/null || true
          ls base-stats | wc -l

      # The full table goes to the step summary; changes.md holds only the
      # tests that regressed or improved, and does not exist when none did.
      - name: Benchmark
        id: bench
        if: github.event_name == 'pull_request' && steps.screen.outputs.build == 'true'
        run: >
          head/tests/bench.py --clang $LLVM/bin/clang --base-root base
          --stats base-stats head-stats --changes changes.md
          base/build/vereda head/build/vereda

      # One comment per pull request, edited on each later run and posted
      # even when the benchmark found a regression. When nothing changed,
      # the comment of an earlier run is deleted rather than left stale.
      - name: Comment on the pull request
        if: >
          always() && github.event_name == 'pull_request' &&
          (steps.bench.outcome == 'success' || steps.bench.outcome == 'failure' ||
           steps.screen.outputs.build == 'false')
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -s changes.md ]; then
            { echo "## Performance: base → head"
              echo
              echo "Base $BASE, head $HEAD. Only the tests that got better or worse;"
              echo "the full table is in the job's summary."
              echo
              cat changes.md; } > comment.md
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md \
              --edit-last --create-if-none
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq \
              '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("## Performance"))) | .id' |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$id"
            done
          fi
